services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.0@sha256:7eb4a553507ce3f200deff2ec0211ab3cf834ba19eb44dd68e83ccc236509feb
    container_name: postiz
    restart: always
    environment:
      MAIN_URL: ${POSTIZ_URL}
      FRONTEND_URL: ${POSTIZ_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://postiz-user:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'true'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''
      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''
      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''
      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''
      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''
      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''
      MASTODON_URL: https://mastodon.social
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''
      OPENAI_API_KEY: ''
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      API_LIMIT: 30
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''
      NX_ADD_PLUGINS: false
      DISALLOW_PLUS: 'true'
      WORKER_CONCURRENCY_DIVIDER: '4'
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      POSTIZ_FACEBOOK_PAGE_IDS: ${POSTIZ_FACEBOOK_PAGE_IDS:-}
      NOT_SECURED: ${POSTIZ_NOT_SECURED:-false}
    volumes:
    - ./config:/config/
    - ./patches/statistiques/page_client-reference-manifest.js:/app/apps/frontend/.next/server/app/(app)/(site)/analytics/page_client-reference-manifest.js:ro
    - ./patches/statistiques/analytics.controller.js:/app/apps/backend/dist/apps/backend/src/api/routes/analytics.controller.js:ro
    - ./patches/statistiques/integration.service.js:/app/apps/backend/dist/libraries/nestjs-libraries/src/database/prisma/integrations/integration.service.js:ro
    - ./patches/statistiques/analytics-chunk.js:/app/apps/frontend/.next/static/chunks/2oleqvm41_c85.js:ro
    - ./patches/statistiques/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./data/postiz-uploads:/uploads/
    - type: bind
      source: ./patches/facebook/backend.js
      target: /app/apps/backend/dist/libraries/nestjs-libraries/src/integrations/social/facebook.provider.js
      read_only: true
    - type: bind
      source: ./patches/youtube/no.auth.integrations.controller.js
      target: /app/apps/backend/dist/apps/backend/src/api/routes/no.auth.integrations.controller.js
      read_only: true
    - type: bind
      source: ./patches/youtube/backend.js
      target: /app/apps/backend/dist/libraries/nestjs-libraries/src/integrations/social/youtube.provider.js
      read_only: true
    - type: bind
      source: ./patches/facebook/orchestrator.js
      target: /app/apps/orchestrator/dist/libraries/nestjs-libraries/src/integrations/social/facebook.provider.js
      read_only: true
    - type: bind
      source: ./patches/youtube/orchestrator.js
      target: /app/apps/orchestrator/dist/libraries/nestjs-libraries/src/integrations/social/youtube.provider.js
      read_only: true
    ports:
    - ${POSTIZ_BIND:-127.0.0.1}:${POSTIZ_PORT:-4007}:5000
    networks:
    - postiz-network
    - temporal-network
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
    - ./data/postgres-volume:/var/lib/postgresql/data
    networks:
    - postiz-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
    - ./data/postiz-redis-data:/data
    networks:
    - postiz-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  spotlight:
    profiles:
    - debug
    pull_policy: always
    container_name: postiz-spotlight
    restart: unless-stopped
    ports:
    - 127.0.0.1:8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:latest
    networks:
    - postiz-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  temporal-elasticsearch:
    container_name: postiz-temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
    - cluster.routing.allocation.disk.threshold_enabled=true
    - cluster.routing.allocation.disk.watermark.low=512mb
    - cluster.routing.allocation.disk.watermark.high=256mb
    - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - xpack.security.enabled=false
    networks:
    - temporal-network
    expose:
    - 9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
    - ./data/temporal-elasticsearch-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  temporal-postgresql:
    container_name: postiz-temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    networks:
    - temporal-network
    expose:
    - 5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U temporal
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
    - ./data/temporal-postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  temporal:
    container_name: postiz-temporal
    restart: always
    ports:
    - 127.0.0.1:17233:7233
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
    - POSTGRES_SEEDS=temporal-postgresql
    - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    - ENABLE_ES=true
    - ES_SEEDS=temporal-elasticsearch
    - ES_VERSION=v7
    - TEMPORAL_NAMESPACE=default
    networks:
    - temporal-network
    healthcheck:
      test:
      - CMD
      - temporal
      - operator
      - cluster
      - health
      - --address
      - temporal:7233
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
    - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  temporal-admin-tools:
    container_name: postiz-temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: on-failure
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
    - temporal-network
    stdin_open: true
    depends_on:
      temporal:
        condition: service_healthy
    tty: true
    profiles:
    - debug
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  temporal-ui:
    container_name: postiz-temporal-ui
    image: temporalio/ui:2.34.0
    restart: always
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
    - temporal-network
    ports:
    - 127.0.0.1:18080:8080
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      temporal:
        condition: service_healthy
    profiles:
    - debug
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: postiz-workflow-network
name: postiz
