user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    map "$http_sec_fetch_dest:$arg_ancien" $capserv_grille { default 0; "document:" 1; }
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 2G;
    server {
        listen 5000;
        absolute_redirect off;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location = /_next/static/chunks/2oleqvm41_c85-capserv-v2.js {
            alias /config/capserv-stats/assets/analytics-v2.js;
            add_header Cache-Control 'private, no-cache' always;
            add_header X-Content-Type-Options 'nosniff' always;
        }

        location = /_next/static/chunks/2oleqvm41_c85-capserv-v1.js {
            alias /config/capserv-stats/assets/analytics-v1.js;
            add_header Cache-Control 'private, no-cache' always;
            add_header X-Content-Type-Options 'nosniff' always;
        }

        location /capserv-stats/ {
            alias /config/capserv-stats/assets/;
            add_header Cache-Control 'private, no-store' always;
            add_header X-Content-Type-Options 'nosniff' always;
            add_header Referrer-Policy 'same-origin' always;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location = /creation/ { return 308 /creation; }
        location = /_next/static/chunks/0zfx39dizezpa-creation-v3.js {
            alias /config/capserv-stats/assets/creation-layout.js;
            add_header Cache-Control 'private, no-cache' always;
            add_header X-Content-Type-Options 'nosniff' always;
        }
        location = /_next/static/chunks/0zfx39dizezpa-creation-v2.js {
            alias /config/capserv-stats/assets/creation-layout.js;
            add_header Cache-Control 'private, no-cache' always;
            add_header X-Content-Type-Options 'nosniff' always;
        }
        location = /_next/static/chunks/0zfx39dizezpa.js {
            alias /config/capserv-stats/assets/creation-layout.js;
            add_header Cache-Control 'private, no-cache' always;
            add_header X-Content-Type-Options 'nosniff' always;
        }
        location = /creation {
            proxy_pass http://localhost:4200/analytics;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/x-component;
            sub_filter '0zfx39dizezpa.js' '0zfx39dizezpa-creation-v3.js';
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
        location = /launches {
            proxy_pass http://localhost:4200/launches;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/x-component;
            sub_filter '0zfx39dizezpa.js' '0zfx39dizezpa-creation-v3.js';
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
        location / {
            proxy_pass http://localhost:4200/;
            if ($arg_creation = 1) { return 302 /creation; }
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/x-component;
            sub_filter '0zfx39dizezpa.js' '0zfx39dizezpa-creation-v3.js';
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}